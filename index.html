              <span style={{ fontSize: 13 }}>Loading plan data…</span>
            </div>
          )}

          {!loading && error && (
            <div style={{ padding: '32px 20px', textAlign: 'center' }}>
              <div style={{ fontWeight: 600, marginBottom: 6 }}>Could not load this plan</div>
              <div style={{ fontSize: 13, color: 'var(--ink-2)' }}>{error}</div>
            </div>
          )}

          {!loading && !error && data && (
            <React.Fragment>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginBottom: 18 }}>
                <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 10, padding: '14px 16px' }}>
                  <div style={{ fontSize: 12, color: 'var(--ink-2)' }}>Total Plan</div>
                  <div style={{ fontSize: 22, fontWeight: 600, marginTop: 2 }}>{fmt(data.total && data.total.totalPlan)}</div>
                </div>
                <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 10, padding: '14px 16px' }}>
                  <div style={{ fontSize: 12, color: 'var(--ink-2)' }}>Total Actual</div>
                  <div style={{ fontSize: 22, fontWeight: 600, marginTop: 2 }}>{fmt(data.total && data.total.actualTillDate)}</div>
                </div>
                <div style={{ background: 'var(--danger-soft)', border: '1px solid var(--danger)', borderRadius: 10, padding: '14px 16px' }}>
                  <div style={{ fontSize: 12, color: 'var(--danger)' }}>Total Shortfall</div>
                  <div style={{ fontSize: 22, fontWeight: 700, marginTop: 2, color: 'var(--danger)' }}>{fmt(data.total && data.total.totalShortfall)}</div>
                </div>
                <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 10, padding: '14px 16px' }}>
                  <div style={{ fontSize: 12, color: 'var(--ink-2)' }}>Achievement</div>
                  <div style={{ fontSize: 22, fontWeight: 600, marginTop: 2 }}>{achievement != null ? achievement + '%' : '-'}</div>
                </div>
              </div>

              <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12, overflow: 'hidden' }}>
                <div style={{ padding: '14px 20px 2px', fontSize: 13, color: 'var(--ink-2)' }}>
                  Sorted by biggest catch-up needed first
                </div>
                <div style={{ overflowX: 'auto' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, marginTop: 8 }}>
                    <thead>
                      <tr>
                        <th style={{ textAlign: 'left', padding: '10px 20px', fontSize: 12, fontWeight: 600, color: 'var(--ink-2)', borderBottom: '1px solid var(--line)' }}>Product</th>
                        <th style={{ textAlign: 'right', padding: '10px 14px', fontSize: 12, fontWeight: 600, color: 'var(--ink-2)', borderBottom: '1px solid var(--line)' }}>Total Plan</th>
                        <th style={{ textAlign: 'right', padding: '10px 14px', fontSize: 12, fontWeight: 600, color: 'var(--ink-2)', borderBottom: '1px solid var(--line)' }}>Plan Till Date</th>
                        <th style={{ textAlign: 'right', padding: '10px 14px', fontSize: 12, fontWeight: 600, color: 'var(--ink-2)', borderBottom: '1px solid var(--line)' }}>Actual Till Date</th>
                        <th style={{ textAlign: 'right', padding: '10px 14px', fontSize: 12, fontWeight: 600, color: 'var(--ink-2)', borderBottom: '1px solid var(--line)' }}>Shortfall Till Date</th>
                        <th style={{ textAlign: 'right', padding: '10px 14px', fontSize: 12, fontWeight: 600, color: 'var(--ink-2)', borderBottom: '1px solid var(--line)' }}>Total Shortfall</th>
                        <th style={{ textAlign: 'right', padding: '10px 20px', fontSize: 12, fontWeight: 700, color: 'var(--ink-2)', borderBottom: '1px solid var(--line)' }}>Required / day</th>
                      </tr>
                    </thead>
                    <tbody>
                      {sortedRows.map((r, i) => {
                        const behind = r.shortfallTillDate != null && r.shortfallTillDate < 0;
                        const reqNeg = r.requiredPerDay != null && r.requiredPerDay < 0;
                        return (
                          <tr key={r.name + i}>
                            <td style={{ padding: '9px 20px', borderBottom: '1px solid var(--line)' }}>{r.name}</td>
                            <td style={{ padding: '9px 14px', textAlign: 'right', borderBottom: '1px solid var(--line)' }}>{fmt(r.totalPlan)}</td>
                            <td style={{ padding: '9px 14px', textAlign: 'right', borderBottom: '1px solid var(--line)' }}>{fmt(r.planTillDate)}</td>
                            <td style={{ padding: '9px 14px', textAlign: 'right', borderBottom: '1px solid var(--line)' }}>{fmt(r.actualTillDate)}</td>
                            <td style={{
                              padding: '9px 14px', textAlign: 'right', borderBottom: '1px solid var(--line)', fontWeight: behind ? 700 : 400,
                              background: behind ? 'var(--danger-soft)' : 'transparent', color: behind ? 'var(--danger)' : (r.shortfallTillDate > 0 ? '#1E9E6B' : 'inherit')
                            }}>{fmt(r.shortfallTillDate)}</td>
                            <td style={{ padding: '9px 14px', textAlign: 'right', borderBottom: '1px solid var(--line)', color: r.totalShortfall < 0 ? 'var(--danger)' : (r.totalShortfall > 0 ? '#1E9E6B' : 'inherit') }}>{fmt(r.totalShortfall)}</td>
                            <td style={{ padding: '9px 20px', textAlign: 'right', borderBottom: '1px solid var(--line)', fontWeight: 700, color: reqNeg ? 'var(--danger)' : (r.requiredPerDay > 0 ? '#1E9E6B' : 'inherit') }}>{fmt(r.requiredPerDay)}</td>
                          </tr>
                        );
                      })}
                      {data.total && (
                        <tr>
                          <td style={{ padding: '11px 20px', fontWeight: 700 }}>Total</td>
                          <td style={{ padding: '11px 14px', textAlign: 'right', fontWeight: 700 }}>{fmt(data.total.totalPlan)}</td>
                          <td style={{ padding: '11px 14px', textAlign: 'right', fontWeight: 700 }}>{fmt(data.total.planTillDate)}</td>
                          <td style={{ padding: '11px 14px', textAlign: 'right', fontWeight: 700 }}>{fmt(data.total.actualTillDate)}</td>
                          <td style={{ padding: '11px 14px', textAlign: 'right', fontWeight: 700, color: 'var(--danger)' }}>{fmt(data.total.shortfallTillDate)}</td>
                          <td style={{ padding: '11px 14px', textAlign: 'right', fontWeight: 700, color: 'var(--danger)' }}>{fmt(data.total.totalShortfall)}</td>
                          <td style={{ padding: '11px 20px', textAlign: 'right', fontWeight: 700, color: 'var(--danger)' }}>{fmt(data.total.requiredPerDay)}</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
              {planDataSavedAt && (
                <div style={{ fontSize: 11.5, color: 'var(--ink-3)', marginTop: 8 }}>
                  From an uploaded photo, saved {new Date(planDataSavedAt).toLocaleString('en-IN')}.
                </div>
              )}
            </React.Fragment>
          )}
          </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

function MultiValueCell({ value }) {
  const [expanded, setExpanded] = useState(false);
  if (!value || value === '-' || !value.includes(', ')) {
    return <span className="mono">{value}</span>;
  }
  const parts = value.split(', ');
  if (!expanded) {
    return (
      <span onClick={() => setExpanded(true)} className="mono focus-ring" tabIndex={0}
        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setExpanded(true); } }}
        role="button" aria-expanded="false" aria-label={'Show all ' + parts.length + ' material codes'}
        style={{ display: 'inline-flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
        {parts[0]}
        <span style={{
          fontSize: 11, fontWeight: 600, color: 'var(--accent)', background: 'var(--accent-soft)',
          padding: '1px 7px', borderRadius: 999, flexShrink: 0
        }}>+{parts.length - 1}</span>
      </span>
    );
  }
  return (
    <span onClick={() => setExpanded(false)} className="focus-ring" tabIndex={0}
      onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setExpanded(false); } }}
      role="button" aria-expanded="true" aria-label="Collapse material codes"
      style={{ display: 'inline-flex', flexWrap: 'wrap', gap: 4, cursor: 'pointer', maxWidth: 280 }}>
      {parts.map((p, i) => (
        <span key={i} className="mono" style={{
          fontSize: 12, background: 'var(--surface-2)', padding: '2px 8px', borderRadius: 6, border: '1px solid var(--line)'
        }}>{p}</span>
      ))}
    </span>
  );
}

const TREND_LINE_COLORS = ['#B54E2E', '#2E6FBF', '#1E9E6B', '#D9A400', '#C0568A', '#6B4FBF', '#2AA198', '#C4453A', '#7A8B3F', '#8B5A2B'];

function buildAlloyTrendData(allRows, department, groupValues, groupField, fromDate, toDate, metricFields) {
  groupField = groupField || 'mat';
  metricFields = metricFields || ['total'];
  if (!allRows || !groupValues.length) return { dates: [], rateDatasets: [], qtyDatasets: [], totalQtyByDate: {} };
  const canonicalByNormKey = {};
  groupValues.forEach(v => { canonicalByNormKey[normKey(v)] = v; });
  const dateSet = new Set();
  const byGroupDate = {};
  const totalQtyByDate = {};
  allRows.forEach(r => {
    if (r.dept !== department) return;
    if (fromDate && r.date < fromDate) return;
    if (toDate && r.date > toDate) return;
    totalQtyByDate[r.date] = (totalQtyByDate[r.date] || 0) + r.qty;
    const canonical = canonicalByNormKey[normKey(r[groupField])];
    if (!canonical) return;
    dateSet.add(r.date);
    const key = canonical + '||' + r.date;
    if (!byGroupDate[key]) byGroupDate[key] = { qty: 0, total: 0 };
    byGroupDate[key].qty += r.qty;
    byGroupDate[key].total += metricFields.reduce((sum, f) => sum + (r[f] || 0), 0);
  });
  const dates = Array.from(dateSet).sort();
  const rateDatasets = groupValues.map((val, i) => ({
    label: val,
    data: dates.map(d => {
      const b = byGroupDate[val + '||' + d];
      return b && b.qty ? b.total / b.qty : null;
    }),
    qty: dates.map(d => {
      const b = byGroupDate[val + '||' + d];
      return b ? b.qty : null;
    }),
    borderColor: TREND_LINE_COLORS[i % TREND_LINE_COLORS.length],
    backgroundColor: TREND_LINE_COLORS[i % TREND_LINE_COLORS.length],
    fill: false, tension: 0.3, pointRadius: 4, spanGaps: true
  }));
  const qtyDatasets = groupValues.map((val, i) => ({
    label: val,
    data: dates.map(d => {
      const b = byGroupDate[val + '||' + d];
      return b ? b.qty : null;
    }),
    borderColor: TREND_LINE_COLORS[i % TREND_LINE_COLORS.length],
    backgroundColor: TREND_LINE_COLORS[i % TREND_LINE_COLORS.length],
    fill: false, tension: 0.3, pointRadius: 4, spanGaps: true
  }));
  return { dates, rateDatasets, qtyDatasets, totalQtyByDate };
}

function AlloyTrendChart({ allRows, department, alloys, groupField, fromDate, toDate, ariaLabel, metricFields, yAxisLabel }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const { dates, rateDatasets, totalQtyByDate } = useMemo(
    () => buildAlloyTrendData(allRows, department, alloys, groupField, fromDate, toDate, metricFields),
    [allRows, department, alloys, groupField, fromDate, toDate, metricFields]
  );

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'line',
      data: { labels: dates.map(keyToLabel), datasets: rateDatasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'bottom', labels: { boxWidth: 12, boxHeight: 12, font: { size: 11 } } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const rate = ctx.parsed.y;
                const rateText = rate != null ? rate.toFixed(2) + ' Rs/kg' : 'no data';
                return ctx.dataset.label + ': ' + rateText;
              },
              footer: (items) => {
                if (!items.length) return '';
                const item = items[0];
                const qty = item.dataset.qty ? item.dataset.qty[item.dataIndex] : null;
                return 'Total production: ' + (qty != null ? Math.round(qty).toLocaleString('en-IN') : '0') + ' kg';
              }
            }
          }
        },
        scales: {
          x: { ticks: { autoSkip: false, maxRotation: 45 }, grid: { display: false } },
          y: { title: { display: true, text: yAxisLabel || 'Rs / kg' }, grid: { color: '#E7E2D8' }, beginAtZero: true }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [dates, rateDatasets, totalQtyByDate]);

  if (!rateDatasets.length) {
    return <div style={{ fontSize: 13, color: 'var(--ink-2)', padding: '12px 0' }}>No trend data yet.</div>;
  }

  return (
    <div>
      {dates.length <= 1 && (
        <div style={{ fontSize: 12, color: 'var(--ink-3)', marginBottom: 6 }}>
          Only one date selected — widen the From/To range above to see a trend line instead of single points.
        </div>
      )}
      <div style={{ position: 'relative', height: 280 }}>
        <canvas ref={canvasRef} role="img" aria-label={ariaLabel || "Line chart of Rs per kg cost over time. Hover a point to see quantity."}></canvas>
      </div>
    </div>
  );
}

function BatchRateBarChart({ rows, metricKey, yAxisLabel, ariaLabel }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const key = metricKey || 'rate';
  const capped = useMemo(() => rows.slice(0, 25), [rows]);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'bar',
      data: {
        labels: capped.map(r => r.name),
        datasets: [{
          data: capped.map(r => r[key]),
          backgroundColor: '#B54E2E',
          borderRadius: 4,
          barThickness: 20
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y.toFixed(2) + ' Rs/kg',
              afterLabel: ctx => Math.round(capped[ctx.dataIndex].qty).toLocaleString('en-IN') + ' kg'
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 }, maxRotation: 45, autoSkip: false } },
          y: { title: { display: true, text: yAxisLabel || 'Rs / kg' }, beginAtZero: true, grid: { color: '#E7E2D8' } }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [capped, key]);

  if (!capped.length) {
    return <div style={{ fontSize: 13, color: 'var(--ink-2)', padding: '12px 0' }}>No batch data yet.</div>;
  }

  return (
    <div style={{ position: 'relative', height: 320 }}>
      <canvas ref={canvasRef} role="img" aria-label={ariaLabel || "Bar chart of Rs per kg cost, one bar per batch. Batch numbers on the X axis, Rs per kg on the Y axis."}></canvas>
    </div>
  );
}

function BatchCostChart({ rows, title }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    const labels = rows.map(r => r.name);
    const data = rows.map(r => r.rate);

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Rs/kg',
          data,
          borderColor: '#B54E2E',
          backgroundColor: 'rgba(181,78,46,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: rows.length > 30 ? 0 : 3,
          pointBackgroundColor: '#B54E2E',
          pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { autoSkip: rows.length > 25, maxRotation: 45, font: { size: 10 } }, grid: { display: false } },
          y: { title: { display: true, text: 'Rs / kg' }, grid: { color: '#E7E2D8' } }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [rows]);

  return (
    <div style={{
      background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
      padding: '16px 16px 8px', marginBottom: 16
    }}>
      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, color: 'var(--ink-2)' }}>{title}</div>
      <div style={{ position: 'relative', height: 240 }}>
        <canvas ref={canvasRef} role="img" aria-label={title + ' — line chart.'}></canvas>
      </div>
    </div>
  );
}

function DataTable({ cols, rows, fmt, fmtRate, view, sortKey, sortDir, onSort, onNameClick }) {
  return (
    <div style={{ overflowX: 'auto' }}>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
        <thead>
          <tr>
            {cols.map(([key, label, align]) => {
              const isActive = sortKey === key;
              return (
                <th key={key} onClick={() => onSort && onSort(key)} style={{
                  textAlign: align, padding: '10px 14px', fontSize: 12, fontWeight: 600,
                  color: isActive ? 'var(--accent)' : 'var(--ink-2)', borderBottom: '1px solid var(--line)', whiteSpace: 'nowrap',
                  position: 'sticky', top: 0, background: 'var(--surface)', zIndex: 2,
                  cursor: onSort ? 'pointer' : 'default', userSelect: 'none'
                }}>
                  {label}{isActive ? (sortDir === 'asc' ? ' \u2191' : ' \u2193') : ''}
                </th>
              );
            })}
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={r.name + i} style={{ transition: 'background 0.1s' }}
              onMouseEnter={e => e.currentTarget.style.background = 'var(--surface-2)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              {cols.map(([key, , align]) => {
                const isName = key === 'name';
                const isMono = isName && view === 'batch';
                const isRateCol = key === 'rate' || key.endsWith('Rate');
                const isTextCol = key === 'name' || key === 'wc' || key === 'material' || key === 'matCode';
                const isDateCol = key === 'date';
                const isTimeCol = key === 'startTime' || key === 'endTime';
                const isRunTimeCol = key === 'runTime';
                let val;
                if (isDateCol) val = keyToLabel(r[key]);
                else if (isTimeCol) val = formatDateTime(r[key]);
                else if (isRunTimeCol) val = formatRunTime(r[key]);
                else if (isRateCol) val = fmtRate(r[key]);
                else if (isTextCol) val = r[key] || '-';
                else val = fmt(r[key]);

                const isMultiValueCol = key === 'matCode' || key === 'material';
                const cellContent = isMultiValueCol
                  ? <MultiValueCell value={val} />
                  : isName
                    ? (
                        <span
                          onClick={() => onNameClick && onNameClick(r.name)}
                          className="focus-ring"
                          title={'Click to filter everything to ' + r.name}
                          style={{ cursor: onNameClick ? 'pointer' : 'default', color: onNameClick ? 'var(--accent)' : 'inherit', textDecoration: 'none' }}
                          onMouseEnter={e => { if (onNameClick) e.currentTarget.style.textDecoration = 'underline'; }}
                          onMouseLeave={e => { e.currentTarget.style.textDecoration = 'none'; }}
                        >
                          {val}
                        </span>
                      )
                    : val;

                return (
                  <td key={key} className={isMono ? 'mono' : ''} style={{
                    padding: '9px 14px', textAlign: align, borderBottom: '1px solid var(--line)',
                    whiteSpace: 'nowrap',
                    fontWeight: key === 'rate' ? 600 : 400
                  }}>{cellContent}</td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function LoadingState() {
  return (
    <div style={{ padding: '64px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, color: 'var(--ink-2)' }}>
      <span className="spin" style={{ width: 22, height: 22, border: '2.5px solid var(--line-strong)', borderTopColor: 'var(--accent)', borderRadius: '50%', display: 'inline-block' }} />
      <span style={{ fontSize: 13 }}>Loading data…</span>
    </div>
  );
}
function ErrorState({ message, onRetry }) {
  return (
    <div style={{ padding: '56px 20px', textAlign: 'center' }}>
      <div style={{ fontWeight: 600, marginBottom: 6 }}>Something went wrong</div>
      <div style={{ fontSize: 13, color: 'var(--ink-2)', marginBottom: 16 }}>{message}</div>
      <button onClick={onRetry} className="focus-ring" style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid var(--line-strong)', background: 'var(--surface)', fontWeight: 600, fontSize: 13 }}>
        Retry
      </button>
    </div>
  );
}
function EmptyState({ title, body, actionLabel, onAction }) {
  return (
    <div style={{ padding: '56px 20px', textAlign: 'center' }}>
      <div style={{ fontWeight: 600, marginBottom: 6 }}>{title}</div>
      <div style={{ fontSize: 13, color: 'var(--ink-2)', marginBottom: actionLabel ? 16 : 0, maxWidth: 340, margin: '0 auto 16px' }}>{body}</div>
      {actionLabel && (
        <button onClick={onAction} className="focus-ring" style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: 'var(--accent)', color: 'var(--accent-ink)', fontWeight: 600, fontSize: 13 }}>
          {actionLabel}
        </button>
      )}
    </div>
  );
}
