/* ============================================================

// Accepts either a bare Sheet ID or a full Google Sheets URL and returns the ID
function extractSheetId(input) {

  const m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);

/* ============================================================
   FIRESTORE TRANSPORT LAYER — plain REST, no Firebase SDK.
   Google's own Firestore docs say every SDK read — even a single
   one-shot .get() — runs as a "short-lived snapshot listener":
   a polling-then-listen model built for real-time sync. We never
   need real-time updates here, so that machinery is pure overhead
   (it's what was making the page slow after the SDK migration).
   The REST API instead does a plain point lookup over normal
   HTTPS — no channel, no listener, no persistent connection — so
   this bypasses the SDK (and its ~140KB of scripts) entirely.
   One document per date in "batchRows" (its content is that
   date's row array); getAllRowsRemote lists the whole collection
   in one paginated REST call rather than one request per date.
============================================================ */
const FIRESTORE_BASE = 'https://firestore.googleapis.com/v1/projects/' + firebaseConfig.projectId + '/databases/(default)/documents';
const FIRESTORE_KEY = firebaseConfig.apiKey;
const cache = {};

function toFirestoreValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFirestoreValue) } };
  if (typeof v === 'object') {
    const fields = {};
    Object.keys(v).forEach(k => { fields[k] = toFirestoreValue(v[k]); });
    return { mapValue: { fields } };
  }
  return { stringValue: String(v) };
}
function fromFirestoreValue(fv) {
  if (!fv) return null;
  if ('nullValue' in fv) return null;
  if ('booleanValue' in fv) return fv.booleanValue;
  if ('integerValue' in fv) return Number(fv.integerValue);
  if ('doubleValue' in fv) return fv.doubleValue;
  if ('stringValue' in fv) return fv.stringValue;
  if ('arrayValue' in fv) return (fv.arrayValue.values || []).map(fromFirestoreValue);
  if ('mapValue' in fv) {
    const out = {};
    const fields = fv.mapValue.fields || {};
    Object.keys(fields).forEach(k => { out[k] = fromFirestoreValue(fields[k]); });
    return out;
  }
  return null;
}
function docFieldsToObject(doc) {
  const out = {};
  const fields = (doc && doc.fields) || {};
  Object.keys(fields).forEach(k => { out[k] = fromFirestoreValue(fields[k]); });
  return out;
}

async function firestoreGetDoc(path) {
  const res = await fetch(FIRESTORE_BASE + '/' + path + '?key=' + FIRESTORE_KEY);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('Firestore read failed (HTTP ' + res.status + ').');
  return docFieldsToObject(await res.json());
}
async function firestoreSetDoc(path, obj) {
  const fields = {};
  Object.keys(obj).forEach(k => { fields[k] = toFirestoreValue(obj[k]); });
  const mask = Object.keys(obj).map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
  const res = await fetch(FIRESTORE_BASE + '/' + path + '?key=' + FIRESTORE_KEY + '&' + mask, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields })
  });
  if (!res.ok) throw new Error('Firestore write failed (HTTP ' + res.status + ').');
}
async function firestoreDeleteDoc(path) {
  const res = await fetch(FIRESTORE_BASE + '/' + path + '?key=' + FIRESTORE_KEY, { method: 'DELETE' });
  if (!res.ok && res.status !== 404) throw new Error('Firestore delete failed (HTTP ' + res.status + ').');
}
async function firestoreListCollection(collection, maskFields) {
  const out = [];
  let pageToken = null;
  const maskParam = maskFields ? maskFields.map(f => '&mask.fieldPaths=' + encodeURIComponent(f)).join('') : '';
  do {
    let url = FIRESTORE_BASE + '/' + collection + '?key=' + FIRESTORE_KEY + '&pageSize=300' + maskParam;
    if (pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
    const res = await fetch(url);
    if (!res.ok) throw new Error('Firestore list failed (HTTP ' + res.status + ').');
    const json = await res.json();
    (json.documents || []).forEach(doc => {
      out.push({ id: doc.name.split('/').pop(), data: docFieldsToObject(doc) });
    });
    pageToken = json.nextPageToken || null;
  } while (pageToken);
  return out;
}

async function sheetGetMeta(key) {
  const cacheKey = 'meta:' + key;
  if (Object.prototype.hasOwnProperty.call(cache, cacheKey)) return cache[cacheKey];
  const data = await firestoreGetDoc('meta/' + encodeURIComponent(key));
  const val = data && data.value !== undefined ? data.value : null;
  cache[cacheKey] = val;
  return val;
}
async function sheetSetMeta(key, value) {
  cache['meta:' + key] = value;
  await firestoreSetDoc('meta/' + encodeURIComponent(key), { value });
}

// Rows for one date are stored as a SINGLE JSON string field (rowsJson),
// not as a native Firestore array-of-maps. Firestore's typed REST format
// tags every single field of every row (mapValue/fields/stringValue/...),
// which roughly triples the transferred bytes for data shaped like ours
// (many short fields, thousands of rows) — one plain JSON string avoids
// that per-field tagging overhead entirely. Old documents written before
// this change used a "rows" array field; that's read as a fallback so
// nothing breaks before they're next re-uploaded or re-migrated.
function decodeDayDoc(data) {
  if (!data) return [];
  if (data.rowsJson) { try { return JSON.parse(data.rowsJson); } catch (e) { return []; } }
  return data.rows || [];
}

async function getDayRows(dateKey) {
  const cacheKey = 'rows:' + dateKey;
  if (Object.prototype.hasOwnProperty.call(cache, cacheKey)) return cache[cacheKey];
  const data = await firestoreGetDoc('batchRows/' + encodeURIComponent(dateKey));
  const rows = decodeDayDoc(data);
  cache[cacheKey] = rows;
  return rows;
}
async function setDayRows(dateKey, rows) {
  cache['rows:' + dateKey] = rows;
  if (!rows || !rows.length) {
    await firestoreDeleteDoc('batchRows/' + encodeURIComponent(dateKey));
  } else {
    await firestoreSetDoc('batchRows/' + encodeURIComponent(dateKey), { rowsJson: JSON.stringify(rows), updatedAt: Date.now() });
  }
}

// Cheap: lists every date that has data WITHOUT downloading its (large)
// row content — only the "updatedAt" field is requested via a field
// mask, so this call stays tiny (a few KB) no matter how much historical
// data exists, and the app can build the calendar picker / know the
// latest date before paying for any of the actual row data.
async function listAvailableDates() {
  const docs = await firestoreListCollection('batchRows', ['updatedAt']);
  return docs.map(d => d.id).sort();
}

// Fetches full row data for a specific set of dates (parallel one-shot
// reads) — used to load just the dates actually needed right now
// (usually one) rather than the entire history.
async function getRowsForDates(dateKeys) {
  const perDate = await Promise.all(dateKeys.map(d => getDayRows(d)));
  const all = [];
  dateKeys.forEach((d, i) => { (perDate[i] || []).forEach(r => all.push({ ...r, date: d })); });
  return all;
}

// Full history in one paginated list call — used only for the
// background fill-in (all-time alloy/machine rankings), never for the
// initial paint, so it never blocks the page from becoming usable.
async function getAllRowsRemote() {
  const docs = await firestoreListCollection('batchRows');
  const all = [];
  docs.forEach(({ id, data }) => {
    const rowsArr = decodeDayDoc(data);
    cache['rows:' + id] = rowsArr;
    rowsArr.forEach(r => all.push({ ...r, date: id }));
  });
  return all;
}

function normalizeHeader(h) {
  return String(h == null ? '' : h)
    .replace(/\u00A0/g, ' ')
    .replace(/[\r\n]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

function findCol(headers, exact, contains, exclude) {
  const normalized = headers.map(normalizeHeader);
  if (exact) {
    for (const name of exact) {
      const target = normalizeHeader(name);
      const idx = normalized.indexOf(target);
      if (idx !== -1) return idx;
    }
  }
  if (contains) {
    const wanted = contains.map(normalizeHeader);
    const blocked = (exclude || []).map(normalizeHeader);
    for (let i = 0; i < normalized.length; i++) {
      const h = normalized[i];
      if (wanted.every(k => h.includes(k)) && !blocked.some(k => h.includes(k))) return i;
    }
  }
  return -1;
}

function findCostColumns(headers, family, type) {
  const amount = findCol(headers,
    [family + ' Amount'],
    [family.toLowerCase(), 'amount']
  );
  const rate = findCol(headers,
    [family + ' Rs/KG', family + ' Rs/Kg', family + ' Rs/kg'],
    [family.toLowerCase(), 'rs/kg']
  );
  return { amount, rate, type };
}

function dateToKey(val) {
  if (typeof val === 'number' && isFinite(val)) {
    const ms = Date.UTC(1899, 11, 30) + Math.round(val) * 86400000;
    const d = new Date(ms);
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }
  if (val instanceof Date && !isNaN(val)) {
    return val.getUTCFullYear() + '-' + String(val.getUTCMonth() + 1).padStart(2, '0') + '-' + String(val.getUTCDate()).padStart(2, '0');
  }
  if (typeof val === 'string') {
    const s = val.trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return m[3] + '-' + m[1].padStart(2, '0') + '-' + m[2].padStart(2, '0');
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
    const d = new Date(s);
    if (!isNaN(d)) return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }
  return 'unknown';
}
function keyToLabel(key) {
  if (key === 'unknown') return 'Unknown date';
  const [y, m, d] = key.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d + ' ' + months[parseInt(m, 10) - 1] + ' ' + y;
}

function parseDateTimeMs(val) {
  if (val == null || val === '') return null;
  if (typeof val === 'number' && isFinite(val)) {
    return Date.UTC(1899, 11, 30) + val * 86400000;
  }
  if (val instanceof Date && !isNaN(val)) return val.getTime();
  if (typeof val === 'string') {
    const s = val.trim();
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
    if (m) {
      return Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
    }
    const d = new Date(s);
    if (!isNaN(d)) return d.getTime();
  }
  return null;
}

function formatDateTime(ms) {
  if (ms == null) return '-';
  const d = new Date(ms);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getUTCDate()) + ' ' + months[d.getUTCMonth()] + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
}

function formatRunTime(minutes) {
  if (minutes == null || !isFinite(Number(minutes))) return '-';
  const totalSeconds = Math.max(0, Math.round(Number(minutes) * 60));
  const hours = Math.floor(totalSeconds / 3600);
  const mins = Math.floor((totalSeconds % 3600) / 60);
  const secs = totalSeconds % 60;
  const pad = n => String(n).padStart(2, '0');
  return pad(hours) + ':' + pad(mins) + ':' + pad(secs);
}

function normKey(s) {
  return (s || '').trim().replace(/\s+/g, ' ').toUpperCase();
}

function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const cleaned = String(v == null ? '' : v)
    .replace(/,/g, '')
    .replace(/₹/g, '')
    .trim();
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : 0;
}

async function extractRowsFromPdf(arrayBuffer) {
  const data = new Uint8Array(arrayBuffer);
  const pdf = await pdfjsLib.getDocument({ data }).promise;

  const dataRows = [];
  let headerRow = null;
  let headerX = null; // x-position of each header cell — used as column boundaries

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();

    const rowMap = {};
    content.items.forEach(item => {
      const y = Math.round(item.transform[5]);
      const x = item.transform[4];
      if (!rowMap[y]) rowMap[y] = [];
      if (item.str.trim() !== '') rowMap[y].push({ x, str: item.str });
    });

    const sortedYs = Object.keys(rowMap).map(Number).sort((a, b) => b - a);
    sortedYs.forEach(y => {
      const items = rowMap[y].sort((a, b) => a.x - b.x);
      if (items.length < 10) return;

      if (items[0].str === 'Company Code') {
        if (!headerRow) {
          headerRow = items.map(it => it.str);
          headerX = items.map(it => it.x);
        }
        return;
      }

      if (headerX) {
        // Some SAP exports leave a cell blank (e.g. Batch Confirm Qty for a
        // DROSS/recovery batch) — pdf.js then emits no text item at all for
        // that position. Reading data rows by plain left-to-right token
        // order would silently shift every later column back by one for
        // that row. Bucketing each token by which header column's x-range
        // it actually falls into keeps a blank cell blank instead, so every
        // later value — Start/End Time included — lands in the right place.
        const buckets = headerX.map(() => []);
        items.forEach(it => {
          let col = 0;
          for (let i = 0; i < headerX.length; i++) {
            if (headerX[i] <= it.x + 3) col = i;
          }
          buckets[col].push(it.str);
        });
        dataRows.push(buckets.map(b => b.join(' ').trim()));
      } else {
        // header not captured yet on this page — fall back to plain order
        dataRows.push(items.map(it => it.str));
      }
    });
  }

  if (!headerRow) throw new Error('Could not find the header row in this PDF.');
  if (!dataRows.length) throw new Error('No data rows found in this PDF.');

  return [headerRow, ...dataRows];
}

async function parseWorkbook(arrayBuffer, isPdf) {
  let rows;

  if (isPdf) {
    rows = await extractRowsFromPdf(arrayBuffer);
  } else {
    const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array', cellDates: false, cellNF: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });
  }

  if (!rows.length) throw new Error('File is empty.');
  const headers = rows[0];
  const dataRows = rows.slice(1).filter(r => r && r.length);

  const locCol = findCol(headers, ['Storage Location'], ['storage', 'location']);
  const wcCol = findCol(headers, ['Work Center Text'], ['work', 'center'], ['code']);
  const matCol = findCol(headers, ['Material Group'], ['material', 'group']);
  const matCodeCol = findCol(headers, ['Material Code'], ['material', 'code'], ['description', 'group']);
  const batchCol = findCol(headers, ['Batch']);
  const dateCol = findCol(headers, ['Posting Date'], ['posting', 'date']);
  const qtyCol = findCol(headers, ['Quantity', 'Qty'], ['qty'], ['unit']);
  const startTimeCol = findCol(headers, ['Batch No. Start Time'], ['start', 'time'], ['end']);
  const endTimeCol = findCol(headers, ['Batch No. End Time'], ['end', 'time'], ['start']);

  const storeDCols = findCostColumns(headers, 'Store Direct', 'storeD');
  const storeICols = findCostColumns(headers, 'Store Indirect', 'storeI');
  const powerDCols = findCostColumns(headers, 'Power Direct', 'powerD');
  const powerICols = findCostColumns(headers, 'Power Indirect', 'powerI');
  const labDCols = findCostColumns(headers, 'Labour Direct', 'labD');
  const labICols = findCostColumns(headers, 'Labour Indirect', 'labI');

  const totalAmountCol = findCol(headers,
    ['Total Amount (Direct + Indirect)', 'Total Amount'],
    ['total', 'amount']
  );
  const totalRateCol = findCol(headers,
    ['Total Rs/KG', 'Total Rs/Kg', 'Total Rs/kg'],
    ['total', 'rs/kg']
  );

  if (locCol === -1 || wcCol === -1) {
    throw new Error('Could not find Storage Location / Work Center columns in this file.');
  }
  if (qtyCol === -1) {
    throw new Error('Could not find Quantity / Qty column in this file.');
  }

  function costValue(r, cols, qty) {
    if (cols.amount !== -1) return num(r[cols.amount]);
    if (cols.rate !== -1) return num(r[cols.rate]) * qty;
    return 0;
  }

  const byDate = {};
  dataRows.forEach(r => {
    const dateKey = dateCol !== -1 ? dateToKey(r[dateCol]) : 'unknown';
    const loc = (r[locCol] || '').toString().trim();
    const dept = GROUP_MAP[loc] || loc || 'Other';
    const wc = (r[wcCol] || 'Unknown').toString().trim();
    const mat = matCol !== -1 ? (r[matCol] || '').toString().trim() : '';
    const matCode = matCodeCol !== -1 ? (r[matCodeCol] || '').toString().trim() : '';
    const batch = batchCol !== -1 ? (r[batchCol] || '').toString().trim() : '';
    const qty = num(r[qtyCol]);
    const startTime = startTimeCol !== -1 ? parseDateTimeMs(r[startTimeCol]) : null;
    const endTime = endTimeCol !== -1 ? parseDateTimeMs(r[endTimeCol]) : null;
    const runTime = (startTime != null && endTime != null) ? (endTime - startTime) / 60000 : null;

    const row = {
      dept,
      wc,
      mat: mat || null,
      matCode: matCode || null,
      batch: batch || null,
      qty,
      startTime,
      endTime,
      runTime,
      storeD: costValue(r, storeDCols, qty),
      storeI: costValue(r, storeICols, qty),
      labD: costValue(r, labDCols, qty),
      labI: costValue(r, labICols, qty),
      powerD: costValue(r, powerDCols, qty),
      powerI: costValue(r, powerICols, qty),
      total: totalAmountCol !== -1
        ? num(r[totalAmountCol])
        : (totalRateCol !== -1 ? num(r[totalRateCol]) * qty : 0)
    };

    if (!byDate[dateKey]) byDate[dateKey] = [];
    byDate[dateKey].push(row);
  });

  return byDate;
}

function aggregateBy(rows, keyFn, nameFn) {
  const buckets = {};

  rows.forEach(r => {
    const k = keyFn(r);
    if (!k) return;

    if (!buckets[k]) {
      buckets[k] = {
        name: nameFn ? nameFn(r) : k,
        date: r.date,
        startTime: r.startTime != null ? r.startTime : null,
        endTime: r.endTime != null ? r.endTime : null,
        runTime: r.runTime != null ? r.runTime : null,
        count: 0,
        qty: 0,
        storeD: 0,
        storeI: 0,
        labD: 0,
        labI: 0,
        powerD: 0,
        powerI: 0,
        total: 0,
        wcs: {},
        mats: {},
        matCodes: {}
      };
    }

    const b = buckets[k];
    b.count++;

    ['qty','storeD','storeI','labD','labI','powerD','powerI','total']
      .forEach(f => b[f] += r[f]);

    if (r.wc) { const nk = normKey(r.wc); b.wcs[nk] = nk; }
    if (r.mat) { const nk = normKey(r.mat); if (!b.mats[nk]) b.mats[nk] = r.mat.trim(); }
    if (r.matCode) { const nk = normKey(r.matCode); if (!b.matCodes[nk]) b.matCodes[nk] = r.matCode.trim(); }
  });

  return Object.values(buckets)
    .map(b => ({
      ...b,
      wc: Object.values(b.wcs).join(', '),
      material: Object.values(b.mats).join(', '),
      matCode: Object.values(b.matCodes)[0] || '',
      rate: b.qty ? b.total / b.qty : 0,
      storeDRate: b.qty ? b.storeD / b.qty : 0,
      storeIRate: b.qty ? b.storeI / b.qty : 0,
      labDRate: b.qty ? b.labD / b.qty : 0,
      labIRate: b.qty ? b.labI / b.qty : 0,
      powerDRate: b.qty ? b.powerD / b.qty : 0,
      powerIRate: b.qty ? b.powerI / b.qty : 0,
      storeTotalRate: b.qty ? (b.storeD + b.storeI) / b.qty : 0,
      labTotalRate: b.qty ? (b.labD + b.labI) / b.qty : 0,
      powerTotalRate: b.qty ? (b.powerD + b.powerI) / b.qty : 0
    }))
    .sort((a, b) => b.qty - a.qty);
}

/* ============================================================
   PLAN vs ACTUAL — fetch + parse
   Fetched via the Apps Script backend (action=getPlanRows), so
   the plan sheet never needs "anyone with the link" sharing —
   only normal sharing with whichever Google account the script
   runs as. Parsing is done by matching HEADER TEXT, not fixed
   column positions.
============================================================ */
function parseCsvText(text) {
  // minimal CSV parser: handles quoted fields, escaped quotes, commas/newlines inside quotes
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function fetchPlanSheetCsv(sheetId, sheetName) {
  const url = GOOGLE_SHEET_API_URL + '?action=getPlanRows' +
    '&sheetId=' + encodeURIComponent(sheetId) + '&tabName=' + encodeURIComponent(sheetName);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Could not reach the backend (HTTP ' + res.status + ').');
  const json = await res.json();
  if (!json || json.success === false) {
    throw new Error((json && json.error) || 'The backend could not read that plan sheet/tab.');
  }
  return json.rows || [];
}

// finds the "catch-up" summary table anywhere in the sheet by matching
// header text (Product / Plan / Actual-or-Transferred / Shortfall /
// Required-per-day) rather than a fixed row/column position
function findCatchupHeaderRow(rows) {
  for (let r = 0; r < rows.length; r++) {
    const cells = rows[r].map(c => (c || '').toString().trim().toLowerCase());
    const hasProduct = cells.some(c => c === 'product');
    const hasPlan = cells.some(c => c.includes('plan'));
    const hasActual = cells.some(c => c.includes('actual') || c.includes('transfer'));
    const hasShortfall = cells.some(c => c.includes('shortfall'));
    if (hasProduct && hasPlan && hasActual && hasShortfall) return r;
  }
  return -1;
}

function colIndexMatching(headerCells, predicate) {
  for (let i = 0; i < headerCells.length; i++) {
    if (predicate(headerCells[i])) return i;
  }
  return -1;
}

function parseNum(v) {
  if (v == null || v === '') return null;
  const n = parseFloat(String(v).replace(/,/g, ''));
  return isFinite(n) ? n : null;
}

function parsePlanCatchup(rows) {
  const headerIdx = findCatchupHeaderRow(rows);
  if (headerIdx === -1) return { rows: [], total: null };

  const header = rows[headerIdx].map(c => (c || '').toString().trim().toLowerCase());
  const cProduct = colIndexMatching(header, c => c === 'product');
  const cTotalPlan = colIndexMatching(header, c => c.includes('total') && c.includes('plan'));
  const cPlanTillDate = colIndexMatching(header, c => c.includes('plan') && c.includes('till'));
  const cActualTillDate = colIndexMatching(header, c => (c.includes('transfer') || c.includes('actual')) && c.includes('till'));
  const cShortfallTillDate = colIndexMatching(header, c => c.includes('shortfall') && c.includes('till'));
  const cTotalShortfall = colIndexMatching(header, c => c.includes('total') && c.includes('shortfall'));
  const cRequiredPerDay = colIndexMatching(header, c => c.includes('required'));

  if (cProduct === -1) return { rows: [], total: null };

  const out = [];
  let total = null;
  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const name = (row[cProduct] || '').toString().trim();
    if (!name) break; // blank row ends the table
    const entry = {
      name,
      totalPlan: parseNum(row[cTotalPlan]),
      planTillDate: parseNum(row[cPlanTillDate]),
      actualTillDate: parseNum(row[cActualTillDate]),
      shortfallTillDate: parseNum(row[cShortfallTillDate]),
      totalShortfall: parseNum(row[cTotalShortfall]),
      requiredPerDay: parseNum(row[cRequiredPerDay])
    };
    if (name.toLowerCase() === 'total' || name.toLowerCase() === 'g.total') {
      total = entry;
    } else {
      out.push(entry);
    }
  }
  return { rows: out, total };
}

/* ============================================================
   PLAN vs ACTUAL — from a photo (OCR)
   Tesseract reads individual words with their pixel position on
   the image. Numbers OCR very reliably; header text often doesn't
   (tight column spacing merges words together), so instead of
   trying to match header labels, this assumes the catch-up
   table's column ORDER is always: Product, Total Plan, Plan Till
   Date, Actual Till Date, Shortfall Till Date, Total Shortfall,
   Required/day — the same fixed layout every screenshot of this
   table has — and reconstructs columns from word X-position,
   the same bucketing idea used for the SAP PDF parser.
============================================================ */
function groupWordsIntoRows(words, yThreshold) {
  const sorted = [...words].sort((a, b) => a.y0 - b.y0);
  const rows = [];
  sorted.forEach(w => {
    const midY = (w.y0 + w.y1) / 2;
    let row = rows.find(r => Math.abs(r.midY - midY) < yThreshold);
    if (!row) { row = { midY, words: [] }; rows.push(row); }
    row.words.push(w);
    row.midY = row.words.reduce((s, ww) => s + (ww.y0 + ww.y1) / 2, 0) / row.words.length;
  });
  rows.sort((a, b) => a.midY - b.midY);
  rows.forEach(r => r.words.sort((a, b) => a.x0 - b.x0));
  return rows.map(r => r.words);
}

// a product name like "NS 20%" or "ALBR (COLUMBIA CORE)" OCRs as several
// separate words that sit close together — merge words whose gap is small
// relative to the text height into one cell, so they land in one column
// bucket instead of being mistaken for several columns
function mergeWordsIntoCells(rowWords) {
  if (!rowWords.length) return [];
  const avgHeight = rowWords.reduce((s, w) => s + (w.y1 - w.y0), 0) / rowWords.length;
  const gapThreshold = Math.max(10, avgHeight * 0.9);
  const cells = [];
  rowWords.forEach(w => {
    const last = cells[cells.length - 1];
    if (last && (w.x0 - last.x1) < gapThreshold) {
      last.text += ' ' + w.text;
      last.x1 = Math.max(last.x1, w.x1);
    } else {
      cells.push({ text: w.text, x0: w.x0, x1: w.x1 });
    }
  });
  return cells;
}

function bucketRowByColumns(rowCells, boundaries) {
  const buckets = boundaries.map(() => []);
  rowCells.forEach(c => {
    let col = 0;
    for (let i = 0; i < boundaries.length; i++) {
      if (boundaries[i] <= c.x0 + 5) col = i;
    }
    buckets[col].push(c.text);
  });
  return buckets.map(b => b.join(' ').trim());
}

async function extractPlanTableFromImage(file, onProgress) {
  const { data } = await Tesseract.recognize(file, 'eng', {
    logger: m => { if (onProgress && m.status === 'recognizing text') onProgress(Math.round((m.progress || 0) * 100)); }
  });
  const words = (data.words || [])
    .map(w => ({ text: w.text, x0: w.bbox.x0, x1: w.bbox.x1, y0: w.bbox.y0, y1: w.bbox.y1 }))
    .filter(w => w.text.trim() !== '');
  if (!words.length) throw new Error('Could not read any text from that image.');

  const rows = groupWordsIntoRows(words, 14).map(mergeWordsIntoCells);
  if (rows.length < 2) throw new Error('Could not detect a table (need a header row plus at least one data row).');

  const dataRowCandidates = rows.slice(1);
  let refRow = dataRowCandidates[0];
  dataRowCandidates.forEach(r => { if (r.length > refRow.length) refRow = r; });
  const boundaries = refRow.map(c => c.x0);

  return dataRowCandidates.map(r => bucketRowByColumns(r, boundaries));
}

function fixedColumnsToEntries(dataRows) {
  const out = [];
  let total = null;
  dataRows.forEach(row => {
    const name = (row[0] || '').toString().trim();
    if (!name) return;
    const entry = {
      name,
      totalPlan: parseNum(row[1]),
      planTillDate: parseNum(row[2]),
      actualTillDate: parseNum(row[3]),
      shortfallTillDate: parseNum(row[4]),
      totalShortfall: parseNum(row[5]),
      requiredPerDay: parseNum(row[6])
    };
    if (name.toLowerCase() === 'total' || name.toLowerCase() === 'g.total') total = entry;
    else out.push(entry);
  });
  return { rows: out, total };
}

function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem('bwt-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const [availableDates, setAvailableDates] = useState([]);
  const [historyLoading, setHistoryLoading] = useState(false);
  const [allRows, setAllRows] = useState(null);
  const [fromDate, setFromDate] = useState(null);
  const [toDate, setToDate] = useState(null);
  const [department, setDepartment] = useState('CCP');
  const [view, setView] = useState('wc');
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState('desc');
  const [search, setSearch] = useState('');
  const [selectedMachine, setSelectedMachine] = useState('');
  const [selectedBatch, setSelectedBatch] = useState('');
  const [showPlanModal, setShowPlanModal] = useState(false);
  const [planTabKey, setPlanTabKey] = useState('ccp');
  const [planLoading, setPlanLoading] = useState(false);
  const [planError, setPlanError] = useState(null);
  const [planData, setPlanData] = useState(null);
  const [planSheetId, setPlanSheetId] = useState(PLAN_SHEET_ID_DEFAULT);
  const [planMonthSuffix, setPlanMonthSuffix] = useState(PLAN_MONTH_SUFFIX_DEFAULT);
  const [planSettingsLoaded, setPlanSettingsLoaded] = useState(false);
  const [planDataSavedAt, setPlanDataSavedAt] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadElapsedMs, setLoadElapsedMs] = useState(null);
  const [error, setError] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [toast, setToast] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    localStorage.setItem('bwt-theme', theme);
  }, [theme]);

  const showToast = useCallback((msg, isError) => {
    setToast({ msg, isError });
    setTimeout(() => setToast(t => (t && t.msg === msg ? null : t)), isError ? 5000 : 3000);
  }, []);

  // The calendar/date picker uses the full list of dates that have data
  // (cheap to fetch — see listAvailableDates), not whatever happens to be
  // loaded into allRows yet, so it shows every real date immediately even
  // while the background history fill below is still in progress.
  const dateIndex = availableDates;

  const loadAll = useCallback(async () => {
    setLoading(true); setError(null); setLoadElapsedMs(null);
    const startedAt = performance.now();
    try {
      const datesAsc = await listAvailableDates();
      const datesDesc = datesAsc.slice().reverse();
      setAvailableDates(datesDesc);
      const latest = datesDesc[0] || null;
      setFromDate(prev => (prev && datesAsc.includes(prev)) ? prev : latest);
      setToDate(prev => (prev && datesAsc.includes(prev)) ? prev : latest);

      // Fast phase: only fetch the one date actually needed for the
      // default view, so the page becomes usable almost immediately
      // instead of waiting for every historical date to download.
      const initialRows = latest ? await getRowsForDates([latest]) : [];
      setAllRows(initialRows);
      setLoadElapsedMs(performance.now() - startedAt);
      setLoading(false);

      // Background phase: quietly fill in the rest of history (needed
      // for the "all-time top 10 by volume" ranking used in the trend
      // charts) without blocking the page the user is already looking at.
      if (datesAsc.length > 1) {
        setHistoryLoading(true);
        getAllRowsRemote()
          .then(fullRows => setAllRows(fullRows))
          .catch(() => { /* the page still works with just the initial date */ })
          .finally(() => setHistoryLoading(false));
      }
    } catch (e) {
      setError('Could not reach the data source. Check your connection and try again.');
      setLoading(false);
    }
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  // If the user picks a date range that includes dates not loaded yet
  // (e.g. before the background history fill finishes), fetch just
  // those missing dates on demand instead of waiting for everything.
  useEffect(() => {
    if (!fromDate || !toDate || !allRows) return;
    const lo = fromDate <= toDate ? fromDate : toDate;
    const hi = fromDate <= toDate ? toDate : fromDate;
    const needed = availableDates.filter(d => d >= lo && d <= hi);
    const loaded = new Set(allRows.map(r => r.date));
    const missing = needed.filter(d => !loaded.has(d));
    if (!missing.length) return;
    let cancelled = false;
    getRowsForDates(missing).then(extra => {
      if (cancelled) return;
      setAllRows(prev => (prev || []).concat(extra));
    });
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fromDate, toDate, availableDates]);

  // load the saved Plan-sheet settings (ID + month suffix) once, the first
  // time the modal is opened — falls back to the hardcoded defaults if
  // nothing has been saved yet
  useEffect(() => {
    if (!showPlanModal || planSettingsLoaded) return;
    let cancelled = false;
    Promise.all([sheetGetMeta('plan-sheet-id'), sheetGetMeta('plan-month-suffix')])
      .then(([savedId, savedSuffix]) => {
        if (cancelled) return;
        if (savedId) setPlanSheetId(savedId);
        if (savedSuffix) setPlanMonthSuffix(savedSuffix);
        setPlanSettingsLoaded(true);
      })
      .catch(() => { if (!cancelled) setPlanSettingsLoaded(true); });
    return () => { cancelled = true; };
  }, [showPlanModal, planSettingsLoaded]);

  const savePlanSettings = useCallback(async (newSheetId, newSuffix) => {
    setPlanSheetId(newSheetId);
    setPlanMonthSuffix(newSuffix);
    await Promise.all([
      sheetSetMeta('plan-sheet-id', newSheetId),
      sheetSetMeta('plan-month-suffix', newSuffix)
    ]);
  }, []);

  const planTabs = useMemo(() => buildPlanTabs(planMonthSuffix), [planMonthSuffix]);

  useEffect(() => {
    if (!showPlanModal || !planSettingsLoaded) return;
    const tab = planTabs.find(t => t.key === planTabKey);
    if (!tab) return;
    let cancelled = false;
    setPlanLoading(true); setPlanError(null); setPlanDataSavedAt(null);

    sheetGetMeta('plan-manual-data-' + planTabKey)
      .then(raw => {
        if (cancelled) return null;
        if (raw) {
          try {
            const saved = JSON.parse(raw);
            if (saved && saved.rows && saved.rows.length) {
              setPlanData({ rows: saved.rows, total: saved.total || null });
              setPlanDataSavedAt(saved.savedAt || null);
              setPlanLoading(false);
              return 'used-manual';
            }
          } catch (e) { /* fall through to live fetch */ }
        }
        return null;
      })
      .then(outcome => {
        if (cancelled || outcome === 'used-manual') return;
        // no manually-uploaded data saved yet for this tab — try the live fetch
        return fetchPlanSheetCsv(planSheetId, tab.sheetName)
          .then(rows => {
            if (cancelled) return;
            const parsed = parsePlanCatchup(rows);
            if (!parsed.rows.length) {
              setPlanError('Could not find a Plan/Actual/Shortfall table on the "' + tab.sheetName + '" tab, and no photo has been uploaded for it yet.');
              setPlanData(null);
            } else {
              setPlanData(parsed);
            }
          })
          .catch(e => { if (!cancelled) { setPlanError((e.message || 'Could not load the plan sheet.') + ' You can upload a photo of this tab instead — see Upload Photo below.'); setPlanData(null); } })
          .finally(() => { if (!cancelled) setPlanLoading(false); });
      });

    return () => { cancelled = true; };
  }, [showPlanModal, planTabKey, planSheetId, planTabs, planSettingsLoaded]);

  const saveManualPlanData = useCallback(async (tabKey, parsed) => {
    const savedAt = Date.now();
    await sheetSetMeta('plan-manual-data-' + tabKey, JSON.stringify({ rows: parsed.rows, total: parsed.total, savedAt }));
    setPlanData(parsed);
    setPlanDataSavedAt(savedAt);
    setPlanError(null);
  }, []);

  const rows = useMemo(() => {
    if (!allRows || !fromDate || !toDate) return allRows === null ? null : [];
    const lo = fromDate <= toDate ? fromDate : toDate;
    const hi = fromDate <= toDate ? toDate : fromDate;
    return allRows.filter(r => r.date >= lo && r.date <= hi);
  }, [allRows, fromDate, toDate]);

  const [uploadProgress, setUploadProgress] = useState(null);

  const handleFiles = useCallback(async (fileList) => {
    const files = Array.from(fileList);
    if (!files.length) return;
    setUploading(true);
    const loadedLabels = [];
    const failed = [];
    let updatedRows = allRows ? allRows.slice() : [];
    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        setUploadProgress({ current: i + 1, total: files.length, name: file.name });
        try {
          const buf = await file.arrayBuffer();
          const isPdf = file.name.toLowerCase().endsWith('.pdf');
          const byDate = await parseWorkbook(buf, isPdf);
          const dates = Object.keys(byDate);
          if (!dates.length) throw new Error('No usable rows found.');
          for (const dk of dates) {
            await setDayRows(dk, byDate[dk]);
            updatedRows = updatedRows.filter(r => r.date !== dk)
              .concat(byDate[dk].map(r => ({ ...r, date: dk })));
            loadedLabels.push(keyToLabel(dk));
          }
        } catch (e) {
          failed.push(file.name + ': ' + (e.message || 'failed'));
        }
      }

      setAllRows(updatedRows);
      const newDates = Array.from(new Set(updatedRows.map(r => r.date))).sort().reverse();

      if (loadedLabels.length) {
        showToast('Loaded ' + loadedLabels.join(', ') + (failed.length ? ' — ' + failed.length + ' file(s) failed' : ''), failed.length > 0 && !loadedLabels.length);
        setFromDate(newDates[0]);
        setToDate(newDates[0]);
      }
      if (failed.length && !loadedLabels.length) {
        showToast(failed.join(' | '), true);
      } else if (failed.length) {
        showToast('Some files failed: ' + failed.join(' | '), true);
      }
    } catch (e) {
      showToast(e.message || 'Upload failed.', true);
    } finally {
      setUploading(false);
      setUploadProgress(null);
    }
  }, [allRows, showToast]);

  const deptRows = useMemo(() => (rows || []).filter(r => r.dept === department), [rows, department]);
  const hasBatch = useMemo(() => deptRows.some(r => r.batch), [deptRows]);

  const machineOptions = useMemo(() => {
    const totals = {};
    const display = {};
    deptRows.forEach(r => {
      if (!r.wc) return;
      const key = normKey(r.wc);
      totals[key] = (totals[key] || 0) + r.qty;
      if (!display[key]) display[key] = normKey(r.wc);
    });
    return Object.keys(totals).sort((a, b) => totals[b] - totals[a]).map(k => display[k]);
  }, [deptRows]);

  const batchOptions = useMemo(() => {
    const normM = selectedMachine ? normKey(selectedMachine) : null;
    const totals = {};
    deptRows.forEach(r => {
      if (!r.batch) return;
      if (normM && normKey(r.wc) !== normM) return;
      totals[r.batch] = (totals[r.batch] || 0) + r.qty;
    });
    return Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
  }, [deptRows, selectedMachine]);

  const alloyOptions = useMemo(() => {
    const totals = {};
    deptRows.forEach(r => {
      if (!r.mat) return;
      totals[r.mat] = (totals[r.mat] || 0) + r.qty;
    });
    return Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
  }, [deptRows]);

  const effectiveSelectedBatch = view === 'batch' ? selectedBatch : '';

  const searchedAllRows = useMemo(() => {
    if (!allRows) return allRows;
    let result = allRows;
    if (selectedMachine) {
      const normM = normKey(selectedMachine);
      result = result.filter(r => normKey(r.wc || '') === normM);
    }
    if (effectiveSelectedBatch) {
      result = result.filter(r => r.batch === effectiveSelectedBatch);
    }
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      result = result.filter(r =>
        (r.mat || '').toLowerCase().includes(q) ||
        (r.wc || '').toLowerCase().includes(q) ||
        (r.matCode || '').toLowerCase().includes(q)
      );
    }
    return result;
  }, [allRows, search, selectedMachine, effectiveSelectedBatch]);

  const allTimeAlloyOptions = useMemo(() => {
    if (!searchedAllRows) return [];
    const totals = {};
    const display = {};
    searchedAllRows.forEach(r => {
      if (r.dept !== department || !r.mat) return;
      const nameLower = r.mat.toLowerCase();
      if (nameLower.includes('dross') || nameLower.includes('scrap')) return;
      const key = normKey(r.mat);
      totals[key] = (totals[key] || 0) + r.qty;
      if (!display[key]) display[key] = r.mat.trim();
    });
    return Object.keys(totals).sort((a, b) => totals[b] - totals[a]).slice(0, 10).map(k => display[k]);
  }, [searchedAllRows, department]);

  const allTimeMachineOptions = useMemo(() => {
    if (!searchedAllRows) return [];
    const totals = {};
    searchedAllRows.forEach(r => {
      if (r.dept !== department || !r.wc) return;
      const key = normKey(r.wc);
      totals[key] = (totals[key] || 0) + r.qty;
    });
    return Object.keys(totals).sort((a, b) => totals[b] - totals[a]).slice(0, 10);
  }, [searchedAllRows, department]);

  useEffect(() => {
    if (view === 'batch' && !hasBatch) setView('wc');
  }, [hasBatch, view]);

  useEffect(() => {
    setSortKey(null);
    setSortDir('desc');
  }, [view]);

  useEffect(() => {
    setSearch('');
    setSelectedMachine('');
    setSelectedBatch('');
  }, [department]);

  useEffect(() => {
    if (selectedBatch && !batchOptions.includes(selectedBatch)) setSelectedBatch('');
  }, [batchOptions, selectedBatch]);

  const aggregated = useMemo(() => {
    if (view === 'wc') return aggregateBy(deptRows, r => r.date + '||' + normKey(r.wc), r => normKey(r.wc));
    if (view === 'alloy') return aggregateBy(
      deptRows,
      r => r.date + '||' + normKey(r.mat || 'Unspecified') + '||' + normKey(r.wc),
      r => (r.mat || 'Unspecified').trim()
    );
    if (view === 'batch') {
      return aggregateBy(
        deptRows,
        r => {
          const batch = r.batch || 'Unknown batch';
          const materialCode = r.matCode || 'Unknown material code';
          return r.date + '||' + batch + '||' + materialCode;
        },
        r => r.batch || 'Unknown batch'
      );
    }
    return [];
  }, [deptRows, view]);

  const filtered = useMemo(() => {
    let result = aggregated;
    if (selectedMachine) {
      const normM = normKey(selectedMachine);
      result = result.filter(r => normKey(r.wc || '') === normM);
    }
    if (effectiveSelectedBatch) {
      result = result.filter(r => r.name === effectiveSelectedBatch);
    }
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      result = result.filter(r =>
        r.name.toLowerCase().includes(q) ||
        (r.wc || '').toLowerCase().includes(q) ||
        (r.matCode || '').toLowerCase().includes(q)
      );
    }
    return result;
  }, [aggregated, search, selectedMachine, effectiveSelectedBatch]);

  const sortedFiltered = useMemo(() => {
    if (!sortKey) return filtered;
    const copy = [...filtered];
    copy.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === 'string' || typeof bv === 'string') {
        const cmp = String(av || '').localeCompare(String(bv || ''));
        return sortDir === 'asc' ? cmp : -cmp;
      }
      return sortDir === 'asc' ? (av - bv) : (bv - av);
    });
    return copy;
  }, [filtered, sortKey, sortDir]);

  function handleSort(key) {
    if (sortKey === key) setSortDir(d => (d === 'asc' ? 'desc' : 'asc'));
    else { setSortKey(key); setSortDir('desc'); }
  }

  function handleNameClick(name) {
    if (view === 'wc') setSelectedMachine(name);
    else if (view === 'batch') setSelectedBatch(name);
    else setSearch(name);
  }

  function handleExportCsv() {
    if (!sortedFiltered.length) return;
    const headers = COLS_AGG.map(([, label]) => label);
    const lines = [headers.join(',')];
    sortedFiltered.forEach(r => {
      const cells = COLS_AGG.map(([key]) => {
        const isRateCol = key === 'rate' || key.endsWith('Rate');
        const isTextCol = key === 'name' || key === 'wc' || key === 'material' || key === 'matCode';
        const isDateCol = key === 'date';
        const isTimeCol = key === 'startTime' || key === 'endTime';
        const isRunTimeCol = key === 'runTime';
        let val;
        if (isDateCol) val = keyToLabel(r[key]);
        else if (isTimeCol) val = formatDateTime(r[key]);
        else if (isRunTimeCol) val = formatRunTime(r[key]);
        else if (isRateCol) val = r[key].toFixed(2);
        else if (isTextCol) val = r[key] || '';
        else val = Math.round(r[key]);
        val = String(val);
        return val.includes(',') ? '"' + val.replace(/"/g, '""') + '"' : val;
      });
      lines.push(cells.join(','));
    });
    const csv = lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const rangeLabel = fromDate === toDate ? keyToLabel(fromDate) : keyToLabel(fromDate) + '_to_' + keyToLabel(toDate);
    a.href = url;
    a.download = 'batchwise_' + department.replace(/[^a-z0-9]+/gi, '_') + '_' + view + '_' + rangeLabel.replace(/\s+/g, '') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const totals = useMemo(() => {
    return filtered.reduce((acc, r) => {
      acc.qty += r.qty; acc.total += r.total;
      acc.storeD += r.storeD; acc.storeI += r.storeI;
      acc.labD += r.labD; acc.labI += r.labI;
      acc.powerD += r.powerD; acc.powerI += r.powerI;
      acc.count += r.count;
      return acc;
    }, { qty: 0, total: 0, storeD: 0, storeI: 0, labD: 0, labI: 0, powerD: 0, powerI: 0, count: 0 });
  }, [filtered]);

  const activeFilters = [];
  if (selectedMachine) activeFilters.push({ key: 'machine', label: 'Machine: "' + selectedMachine + '"', clear: () => setSelectedMachine('') });
  if (view === 'batch' && selectedBatch) activeFilters.push({ key: 'batch', label: 'Batch: "' + selectedBatch + '"', clear: () => setSelectedBatch('') });
  if (search.trim()) activeFilters.push({ key: 'search', label: 'Search: "' + search.trim() + '"', clear: () => setSearch('') });

  const fmt = n => Math.round(n).toLocaleString('en-IN');
  const fmtRate = n => n.toFixed(2);

  const COLS_AGG = [
    ['date', 'Date', 'left'],
    ['name', view === 'batch' ? 'Batch' : view === 'wc' ? 'Machine' : view === 'alloy' ? 'Material' : 'Name', 'left'],
    ...(view === 'batch' ? [['wc', 'Machine', 'left'], ['matCode', 'Material code', 'left']] : []),
    ...(view === 'alloy' ? [['wc', 'Machine', 'left']] : []),
    ...(view === 'wc' ? [['count', 'Batch', 'right']] : []),
    ['qty', 'Qty (kg)', 'right'],
    ...(view === 'batch' ? [
      ['startTime', 'Start Time', 'left'],
      ['endTime', 'End Time', 'left'],
      ['runTime', 'Run Time (HH:MM:SS)', 'right']
    ] : []),
    ['storeDRate', 'Store direct (Rs/kg)', 'right'],
    ['storeIRate', 'Store indirect (Rs/kg)', 'right'],
    ['labDRate', 'Labour direct (Rs/kg)', 'right'],
    ['labIRate', 'Labour indirect (Rs/kg)', 'right'],
    ['powerDRate', 'Power direct (Rs/kg)', 'right'],
    ['powerIRate', 'Power indirect (Rs/kg)', 'right'],
    ['storeTotalRate', 'Total Store (Rs/kg)', 'right'],
    ['labTotalRate', 'Total Labour (Rs/kg)', 'right'],
    ['powerTotalRate', 'Total Power (Rs/kg)', 'right'],
    ['rate', 'Total (Rs/kg)', 'right']
  ];

  return (
    <div style={{ minHeight: '100vh' }}>
      <TopBar
        theme={theme} setTheme={setTheme}
        search={search} setSearch={setSearch}
        onUploadClick={() => fileInputRef.current && fileInputRef.current.click()}
        onExport={handleExportCsv}
        canExport={!!(rows && rows.length)}
        uploading={uploading}
        uploadProgress={uploadProgress}
        onOpenPlan={() => setShowPlanModal(true)}
        loadElapsedMs={loadElapsedMs}
        historyLoading={historyLoading}
      />
      <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.pdf" multiple style={{ display: 'none' }}
        onChange={e => { if (e.target.files.length) handleFiles(e.target.files); e.target.value = ''; }} />

      <main style={{ maxWidth: 1650, margin: '0 auto', padding: '20px 24px 64px' }}>

        <FilterBar
          dateIndex={dateIndex} fromDate={fromDate} setFromDate={setFromDate} toDate={toDate} setToDate={setToDate}
          department={department} setDepartment={setDepartment}
          view={view} setView={setView} hasBatch={hasBatch}
          machineOptions={machineOptions} batchOptions={batchOptions}
          selectedMachine={selectedMachine} setSelectedMachine={setSelectedMachine}
          selectedBatch={selectedBatch} setSelectedBatch={setSelectedBatch}
        />

        {activeFilters.length > 0 && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', margin: '2px 0 16px' }}>
            {activeFilters.map(f => <Chip key={f.key} label={f.label} onRemove={f.clear} />)}
            <button onClick={() => activeFilters.forEach(f => f.clear())} className="focus-ring"
              style={{ background: 'none', border: 'none', color: 'var(--ink-2)', fontSize: 12.5, fontWeight: 600, padding: '4px 6px' }}>
              Clear all
            </button>
          </div>
        )}

        {!loading && !error && rows && rows.length > 0 && (
          <StatRow qty={totals.qty} total={totals.total} entries={totals.count} fmt={fmt} />
        )}

        {!loading && !error && view === 'alloy' && allTimeAlloyOptions.length > 0 && METRIC_CONFIGS.map(m => (
          <div key={m.key} style={{
            background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
            padding: '16px 16px 8px', marginBottom: 16
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)' }}>{m.label} cost per kg over time — by alloy</span>
              <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>(all machines combined, {department} — top 10 alloys by volume)</span>
            </div>
            <AlloyTrendChart allRows={searchedAllRows} department={department} alloys={allTimeAlloyOptions}
              groupField="mat" fromDate={fromDate} toDate={toDate} metricFields={m.fields}
              ariaLabel={m.label + ' cost per kg over time, one line per alloy.'} />
          </div>
        ))}

        {!loading && !error && view === 'alloy' && allTimeAlloyOptions.length > 0 && (
          <div style={{
            background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
            padding: '16px 16px 8px', marginBottom: 16
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)' }}>Total cost per kg over time — by alloy</span>
              <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>(all machines combined, {department} — top 10 alloys by volume — hover a point for qty too)</span>
            </div>
            <AlloyTrendChart allRows={searchedAllRows} department={department} alloys={allTimeAlloyOptions}
              groupField="mat" fromDate={fromDate} toDate={toDate}
              ariaLabel="Line chart of Rs per kg cost over time, one line per alloy. Hover a point to see quantity." />
          </div>
        )}

        {!loading && !error && view === 'wc' && allTimeMachineOptions.length > 0 && METRIC_CONFIGS.map(m => (
          <div key={m.key} style={{
            background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
            padding: '16px 16px 8px', marginBottom: 16
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)' }}>{m.label} cost per kg over time — by machine</span>
              <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>(all alloys combined per machine, {department} — top 10 machines by volume)</span>
            </div>
            <AlloyTrendChart allRows={searchedAllRows} department={department} alloys={allTimeMachineOptions}
              groupField="wc" fromDate={fromDate} toDate={toDate} metricFields={m.fields}
              ariaLabel={m.label + ' cost per kg over time, one line per machine.'} />
          </div>
        ))}

        {!loading && !error && view === 'wc' && allTimeMachineOptions.length > 0 && (
          <div style={{
            background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
            padding: '16px 16px 8px', marginBottom: 16
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)' }}>Total cost per kg over time — by machine</span>
              <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>(all alloys combined per machine, {department} — top 10 machines by volume — hover a point for qty too)</span>
            </div>
            <AlloyTrendChart allRows={searchedAllRows} department={department} alloys={allTimeMachineOptions}
              groupField="wc" fromDate={fromDate} toDate={toDate}
              ariaLabel="Line chart of Rs per kg cost over time, one line per machine. Hover a point to see quantity." />
          </div>
        )}

        {!loading && !error && view === 'batch' && sortedFiltered.length > 0 && METRIC_CONFIGS.map(m => (
          <div key={m.key} style={{
            background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
            padding: '16px 16px 8px', marginBottom: 16
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)' }}>{m.label} cost per kg by batch</span>
              <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>({department}, this selection — top 25 shown, hover a bar for qty)</span>
            </div>
            <BatchRateBarChart rows={sortedFiltered} metricKey={m.batchKey}
              ariaLabel={m.label + ' cost per kg, one bar per batch.'} />
          </div>
        ))}

        {!loading && !error && view === 'batch' && sortedFiltered.length > 0 && (
          <div style={{
            background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
            padding: '16px 16px 8px', marginBottom: 16
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)' }}>Total cost per kg by batch</span>
              <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>({department}, this selection — top 25 shown, hover a bar for qty)</span>
            </div>
            <BatchRateBarChart rows={sortedFiltered} />
          </div>
        )}

        <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12, overflow: 'hidden' }}>
          {loading ? (
            <LoadingState />
          ) : error ? (
            <ErrorState message={error} onRetry={loadAll} />
          ) : !dateIndex.length ? (
            <EmptyState
              title="No data yet"
              body="Upload a cost-sheet export to see work-center, alloy, and batch breakdowns here."
              actionLabel="Upload a file"
              onAction={() => fileInputRef.current && fileInputRef.current.click()}
            />
          ) : filtered.length === 0 ? (
            <EmptyState
              title={search ? 'No matches' : 'No data for this department'}
              body={search ? 'Try a different search term, or clear the search.' : 'This department has no entries for the selected date.'}
              actionLabel={search ? 'Clear search' : null}
              onAction={search ? () => setSearch('') : null}
            />
          ) : (
            <DataTable cols={COLS_AGG} rows={sortedFiltered} fmt={fmt} fmtRate={fmtRate} view={view}
              sortKey={sortKey} sortDir={sortDir} onSort={handleSort} onNameClick={handleNameClick} />
          )}
        </div>
      </main>

      {toast && (
        <div className="fade-in" style={{
          position: 'fixed', bottom: 22, right: 22, background: toast.isError ? 'var(--danger)' : 'var(--ink)',
          color: theme === 'dark' ? 'var(--bg)' : '#fff', padding: '12px 18px', borderRadius: 8, fontSize: 13, maxWidth: 360, zIndex: 50
        }}>
          {toast.msg}
        </div>
      )}

      {showPlanModal && (
        <PlanModal
          onClose={() => setShowPlanModal(false)}
          planTabKey={planTabKey} setPlanTabKey={setPlanTabKey}
          loading={planLoading} error={planError} data={planData}
          planTabs={planTabs}
          planSheetId={planSheetId} planMonthSuffix={planMonthSuffix}
          onSaveSettings={savePlanSettings}
          planDataSavedAt={planDataSavedAt}
          onSaveManualData={saveManualPlanData}
        />
      )}
    </div>
  );
}

function TopBar({ theme, setTheme, search, setSearch, onUploadClick, onExport, canExport, uploading, uploadProgress, onOpenPlan, loadElapsedMs, historyLoading }) {
  return (
    <header style={{ borderBottom: '1px solid var(--line)', background: 'var(--surface)', position: 'sticky', top: 0, zIndex: 10 }}>
      <div className="topbar-row" style={{ maxWidth: 1650, margin: '0 auto', padding: '14px 24px', display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, flexShrink: 0 }}>
          <div style={{ width: 26, height: 26, borderRadius: 6, background: 'var(--accent)', color: 'var(--accent-ink)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 13, flexShrink: 0 }}>B</div>
          <span className="topbar-brand-text" style={{ fontWeight: 600, fontSize: 15, whiteSpace: 'nowrap' }}>Batchwise tracker</span>
        </div>

        <div style={{ flex: '1 1 160px', minWidth: 120, maxWidth: 440, position: 'relative' }}>
          <span style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--ink-3)', display: 'flex' }}>
            <IconSearch />
          </span>
          <input
            value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search work center, alloy, or batch"
            className="focus-ring"
            style={{
              width: '100%', padding: '9px 12px 9px 36px', borderRadius: 8, border: '1px solid var(--line)',
              background: 'var(--surface-2)', color: 'var(--ink)'
            }}

const MONTH_NAMES_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function DateRangeCalendarPicker({ dateIndex, fromDate, setFromDate, toDate, setToDate }) {
  const [openRole, setOpenRole] = useState(null);
  const [viewYear, setViewYear] = useState(null);
  const [viewMonth, setViewMonth] = useState(null);
  const wrapRef = useRef(null);
  const dateSet = useMemo(() => new Set(dateIndex), [dateIndex]);

  useEffect(() => {
    function handleOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpenRole(null);
    }
    document.addEventListener('mousedown', handleOutside);
    return () => document.removeEventListener('mousedown', handleOutside);
  }, []);

  function openFor(role) {
    if (!dateIndex.length) return;
    if (openRole === role) { setOpenRole(null); return; }
    const current = role === 'from' ? fromDate : toDate;
    const base = current || dateIndex[0];
    const [y, m] = base.split('-');
    setViewYear(parseInt(y, 10));
    setViewMonth(parseInt(m, 10) - 1);
    setOpenRole(role);
  }

  function pick(k) {
    if (openRole === 'from') setFromDate(k); else setToDate(k);
    setOpenRole(null);
  }

  function shiftMonth(delta) {
    let m = viewMonth + delta, y = viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setViewMonth(m); setViewYear(y);
  }

  const fieldStyle = (active) => ({
    textAlign: 'left', padding: '7px 12px', borderRadius: 8,
    border: '1px solid ' + (active ? 'var(--accent)' : 'var(--line)'),
    background: active ? 'var(--surface-2)' : 'var(--surface)', cursor: 'pointer'
  });

  let dayCells = null;
  if (openRole && viewYear != null) {
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const activeVal = openRole === 'from' ? fromDate : toDate;
    dayCells = [];
    for (let i = 0; i < firstDay; i++) dayCells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const k = viewYear + '-' + String(viewMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      dayCells.push({ d, k, has: dateSet.has(k), selected: k === activeVal });
    }
  }

  return (
    <div ref={wrapRef} style={{ position: 'relative' }}>
      <div style={{ display: 'flex', gap: 8, background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 8, padding: 4 }}>
        <button type="button" className="focus-ring" disabled={!dateIndex.length} onClick={() => openFor('from')} style={fieldStyle(openRole === 'from')}>
          <span style={{ fontSize: 11, color: 'var(--ink-3)', display: 'block' }}>From</span>
          <span style={{ fontSize: 13, fontWeight: 600 }}>{fromDate ? keyToLabel(fromDate) : 'No dates yet'}</span>
        </button>
        <button type="button" className="focus-ring" disabled={!dateIndex.length} onClick={() => openFor('to')} style={fieldStyle(openRole === 'to')}>
          <span style={{ fontSize: 11, color: 'var(--ink-3)', display: 'block' }}>To</span>
          <span style={{ fontSize: 13, fontWeight: 600 }}>{toDate ? keyToLabel(toDate) : 'No dates yet'}</span>
        </button>
      </div>

      {openRole && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 6px)', left: 0, width: 260, zIndex: 20,
          background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12,
          padding: 12, boxShadow: '0 8px 24px rgba(0,0,0,0.15)'
        }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
            <button type="button" onClick={() => shiftMonth(-1)} className="focus-ring" aria-label="Previous month"
              style={{ width: 26, height: 26, borderRadius: 6, border: '1px solid var(--line)', background: 'var(--surface-2)', cursor: 'pointer' }}>‹</button>
            <span style={{ fontSize: 13, fontWeight: 600 }}>{MONTH_NAMES_FULL[viewMonth]} {viewYear}</span>
            <button type="button" onClick={() => shiftMonth(1)} className="focus-ring" aria-label="Next month"
              style={{ width: 26, height: 26, borderRadius: 6, border: '1px solid var(--line)', background: 'var(--surface-2)', cursor: 'pointer' }}>›</button>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 3 }}>
            {['S','M','T','W','T','F','S'].map((d, i) => (
              <div key={i} style={{ fontSize: 10, color: 'var(--ink-3)', textAlign: 'center', padding: '2px 0' }}>{d}</div>
            ))}
            {dayCells.map((cell, i) => cell === null ? <div key={i} /> : (
              <button key={i} type="button" disabled={!cell.has} onClick={() => pick(cell.k)}
                style={{
                  aspectRatio: '1', borderRadius: 6, border: 'none', fontSize: 12, position: 'relative',
                  cursor: cell.has ? 'pointer' : 'not-allowed',
                  background: cell.selected ? 'var(--accent)' : 'transparent',
                  color: cell.selected ? '#fff' : (cell.has ? 'var(--ink)' : 'var(--ink-3)')
                }}>
                {cell.d}
                {cell.has && !cell.selected && (
                  <span style={{ position: 'absolute', bottom: 2, left: '50%', transform: 'translateX(-50%)', width: 4, height: 4, borderRadius: '50%', background: 'var(--accent)' }} />
                )}
              </button>
            ))}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, color: 'var(--ink-2)', marginTop: 8 }}>
            <span style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--accent)', display: 'inline-block' }} />
            Has data
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   PLAN vs ACTUAL MODAL
============================================================ */
function PlanModal({ onClose, planTabKey, setPlanTabKey, loading, error, data, planTabs, planSheetId, planMonthSuffix, onSaveSettings, planDataSavedAt, onSaveManualData }) {
  const fmt = n => n == null ? '-' : Math.round(n).toLocaleString('en-IN');
  const [showSettings, setShowSettings] = useState(false);
  const [linkDraft, setLinkDraft] = useState(planSheetId);
  const [suffixDraft, setSuffixDraft] = useState(planMonthSuffix);
  const [settingsError, setSettingsError] = useState(null);
  const [ocrLoading, setOcrLoading] = useState(false);
  const [ocrProgress, setOcrProgress] = useState(0);
  const [ocrError, setOcrError] = useState(null);
  const [reviewRows, setReviewRows] = useState(null); // array of editable entries, or null when not reviewing
  const [reviewTotal, setReviewTotal] = useState(null);
  const photoInputRef = useRef(null);

  async function handlePhotoSelected(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setOcrError(null); setOcrLoading(true); setOcrProgress(0);
    try {
      const dataRows = await extractPlanTableFromImage(file, pct => setOcrProgress(pct));
      const parsed = fixedColumnsToEntries(dataRows);
      if (!parsed.rows.length) throw new Error('Could not make out any product rows in that photo. Try a clearer, more zoomed-in photo of just the table.');
      setReviewRows(parsed.rows);
      setReviewTotal(parsed.total);
    } catch (err) {
      setOcrError(err.message || 'Could not read that photo.');
    } finally {
      setOcrLoading(false);
    }
  }

  function updateReviewCell(index, field, value) {
    setReviewRows(prev => {
      const copy = [...prev];
      copy[index] = { ...copy[index], [field]: field === 'name' ? value : parseNum(value) };
      return copy;
    });
  }
  function updateReviewTotalCell(field, value) {
    setReviewTotal(prev => ({ ...(prev || { name: 'Total' }), [field]: field === 'name' ? value : parseNum(value) }));
  }

  async function confirmReview() {
    await onSaveManualData(planTabKey, { rows: reviewRows, total: reviewTotal });
    setReviewRows(null);
    setReviewTotal(null);
  }

  // biggest shortfall first — the rows that need the most catching up
  const sortedRows = useMemo(() => {
    if (!data || !data.rows) return [];
    return [...data.rows].sort((a, b) => (a.requiredPerDay ?? 0) - (b.requiredPerDay ?? 0));
  }, [data]);

  const achievement = data && data.total && data.total.planTillDate
    ? Math.round((data.total.actualTillDate / data.total.planTillDate) * 100)
    : null;

  function handleSaveSettings() {
    const id = extractSheetId(linkDraft);
    if (!id) { setSettingsError('That doesn\'t look like a Google Sheets link or ID.'); return; }
    const suf = suffixDraft.trim();
    if (!suf) { setSettingsError('Month suffix can\'t be empty (e.g. "Sep", "Oct").'); return; }
    setSettingsError(null);
    onSaveSettings(id, suf);
    setShowSettings(false);
  }

  return (
    <div style={{
      position: 'fixed', inset: 0, background: 'rgba(28,27,25,0.5)', zIndex: 100,
      display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: '32px 20px', overflowY: 'auto'
    }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{
        background: 'var(--bg)', borderRadius: 14, width: '100%', maxWidth: 1100,
        maxHeight: '92vh', overflowY: 'auto', boxShadow: '0 20px 60px rgba(0,0,0,0.25)'
      }}>
        <div style={{
          position: 'sticky', top: 0, background: 'var(--surface)', borderBottom: '1px solid var(--line)',
          padding: '16px 24px', display: 'flex', alignItems: 'center', gap: 12, zIndex: 2
        }}>
          <span style={{ fontSize: 16, fontWeight: 700 }}>Plan vs Actual</span>
          <button onClick={() => photoInputRef.current && photoInputRef.current.click()}
            disabled={ocrLoading}
            className="focus-ring"
            style={{
              display: 'flex', alignItems: 'center', gap: 6, marginLeft: 8, padding: '6px 10px', borderRadius: 8,
              border: '1px solid var(--accent)', background: 'var(--accent-soft)',
              color: 'var(--accent)', fontSize: 12, fontWeight: 700, opacity: ocrLoading ? 0.6 : 1
            }}>
            <IconUpload /> {ocrLoading ? 'Reading photo… ' + ocrProgress + '%' : 'Upload Photo'}
          </button>
          <input ref={photoInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handlePhotoSelected} />
          <button onClick={() => { setLinkDraft(planSheetId); setSuffixDraft(planMonthSuffix); setSettingsError(null); setShowSettings(s => !s); }}
            className="focus-ring" aria-label="Plan sheet settings"
            style={{
              display: 'flex', alignItems: 'center', gap: 6, padding: '6px 10px', borderRadius: 8,
              border: '1px solid var(--line-strong)', background: showSettings ? 'var(--surface-2)' : 'var(--surface)',
              color: 'var(--ink-2)', fontSize: 12, fontWeight: 600
            }}>
            <IconGear /> Settings
          </button>
          <button onClick={onClose} className="focus-ring" aria-label="Close"
            style={{ marginLeft: 'auto', background: 'none', border: 'none', display: 'flex', padding: 6, borderRadius: 8, color: 'var(--ink-2)' }}>
            <IconX />
          </button>
        </div>

        {showSettings && (
          <div style={{ padding: '16px 24px', background: 'var(--surface-2)', borderBottom: '1px solid var(--line)' }}>
            <div style={{ fontSize: 12.5, color: 'var(--ink-2)', marginBottom: 10 }}>
              A new Google Sheet is created for this plan every month. Paste this month's sheet link here once — no code change needed after that.
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'flex-end' }}>
              <div style={{ flex: '1 1 320px' }}>
                <label style={{ fontSize: 11, color: 'var(--ink-3)', display: 'block', marginBottom: 3 }}>Google Sheet link (or ID)</label>
                <input value={linkDraft} onChange={e => setLinkDraft(e.target.value)}
                  placeholder="https://docs.google.com/spreadsheets/d/..."
                  className="focus-ring"
                  style={{ width: '100%', padding: '8px 10px', borderRadius: 8, border: '1px solid var(--line)', background: 'var(--surface)' }} />
              </div>
              <div style={{ width: 110 }}>
                <label style={{ fontSize: 11, color: 'var(--ink-3)', display: 'block', marginBottom: 3 }}>Month suffix</label>
                <input value={suffixDraft} onChange={e => setSuffixDraft(e.target.value)}
                  placeholder="Sep"
                  className="focus-ring"
                  style={{ width: '100%', padding: '8px 10px', borderRadius: 8, border: '1px solid var(--line)', background: 'var(--surface)' }} />
              </div>
              <button onClick={handleSaveSettings} className="focus-ring" style={{
                padding: '8px 16px', borderRadius: 8, border: 'none', background: 'var(--accent)', color: 'var(--accent-ink)', fontWeight: 700, fontSize: 13
              }}>Save</button>
            </div>
            {settingsError && <div style={{ fontSize: 12, color: 'var(--danger)', marginTop: 8 }}>{settingsError}</div>}
            <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 8 }}>
              Tab names looked for: "CCP Plan vs Actual {suffixDraft || planMonthSuffix}", "Coil Transfer Plan vs Actual {suffixDraft || planMonthSuffix}", "FG Packing Plan vs Actual {suffixDraft || planMonthSuffix}". Saved for everyone who opens this dashboard.
            </div>
          </div>
        )}

        <div style={{ padding: '20px 24px 28px' }}>
          <div style={{ display: 'flex', gap: 4, background: 'var(--surface-2)', border: '1px solid var(--line)', borderRadius: 8, padding: 3, width: 'fit-content', marginBottom: 18 }}>
            {planTabs.map(t => (
              <button key={t.key} onClick={() => setPlanTabKey(t.key)} className="focus-ring" style={{
                padding: '7px 16px', borderRadius: 6, border: 'none', fontSize: 13, fontWeight: 700,
                background: t.key === planTabKey ? 'var(--surface)' : 'transparent',
                color: t.key === planTabKey ? 'var(--ink)' : 'var(--ink-2)', cursor: 'pointer',
                boxShadow: t.key === planTabKey ? '0 1px 2px rgba(0,0,0,0.06)' : 'none'
              }}>{t.label}</button>
            ))}
          </div>

          {ocrError && (
            <div style={{ padding: '10px 14px', marginBottom: 14, background: 'var(--danger-soft)', border: '1px solid var(--danger)', borderRadius: 8, fontSize: 13, color: 'var(--danger)' }}>
              {ocrError}
            </div>
          )}

          {reviewRows ? (
            <div>
              <div style={{ fontSize: 13, color: 'var(--ink-2)', marginBottom: 10 }}>
                Check the numbers below against the photo — OCR can misread a digit or miss a minus sign. Fix anything wrong, then confirm.
              </div>
              <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12, overflow: 'hidden', marginBottom: 14 }}>
                <div style={{ overflowX: 'auto' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                    <thead>
                      <tr>
                        {['Product', 'Total Plan', 'Plan Till Date', 'Actual Till Date', 'Shortfall Till Date', 'Total Shortfall', 'Required / day'].map(h => (
                          <th key={h} style={{ textAlign: 'left', padding: '9px 12px', fontSize: 11.5, fontWeight: 600, color: 'var(--ink-2)', borderBottom: '1px solid var(--line)' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {reviewRows.map((r, i) => (
                        <tr key={i}>
                          {['name', 'totalPlan', 'planTillDate', 'actualTillDate', 'shortfallTillDate', 'totalShortfall', 'requiredPerDay'].map(field => (
                            <td key={field} style={{ padding: '4px 6px', borderBottom: '1px solid var(--line)' }}>
                              <input value={r[field] == null ? '' : r[field]} onChange={e => updateReviewCell(i, field, e.target.value)}
                                className="focus-ring" style={{ width: field === 'name' ? 130 : 80, padding: '5px 6px', borderRadius: 6, border: '1px solid var(--line)', background: 'var(--surface)' }} />
                            </td>
                          ))}
                        </tr>
                      ))}
                      <tr style={{ background: 'var(--surface-2)' }}>
                        {['name', 'totalPlan', 'planTillDate', 'actualTillDate', 'shortfallTillDate', 'totalShortfall', 'requiredPerDay'].map(field => (
                          <td key={field} style={{ padding: '4px 6px' }}>
                            <input value={(reviewTotal && reviewTotal[field]) ?? (field === 'name' ? 'Total' : '')} onChange={e => updateReviewTotalCell(field, e.target.value)}
                              className="focus-ring" style={{ width: field === 'name' ? 130 : 80, padding: '5px 6px', borderRadius: 6, border: '1px solid var(--line)', background: 'var(--surface)', fontWeight: 700 }} />
                          </td>
                        ))}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <button onClick={confirmReview} className="focus-ring" style={{ padding: '9px 18px', borderRadius: 8, border: 'none', background: 'var(--accent)', color: 'var(--accent-ink)', fontWeight: 700, fontSize: 13 }}>
                  Confirm &amp; Use This Data
                </button>
                <button onClick={() => { setReviewRows(null); setReviewTotal(null); }} className="focus-ring" style={{ padding: '9px 18px', borderRadius: 8, border: '1px solid var(--line-strong)', background: 'var(--surface)', fontWeight: 600, fontSize: 13 }}>
                  Cancel

              </div>

          ) : (
          <React.Fragment>
